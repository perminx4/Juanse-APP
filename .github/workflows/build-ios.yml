name: Build iOS (IPA sin firmar)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Buscar el proyecto Flutter
        run: |
          PUBSPEC=$(find . -name pubspec.yaml -not -path "*/.*" -not -path "*/build/*" | head -1)
          if [ -z "$PUBSPEC" ]; then echo "ERROR: no se encontró pubspec.yaml"; exit 1; fi
          echo "PROJECT_DIR=$(dirname "$PUBSPEC")" >> $GITHUB_ENV

      - name: Arreglar nombres de archivos iOS (sobra el .xml al final)
        run: |
          cd "$PROJECT_DIR/ios"
          find . \( -name "*.storyboard.xml" -o -name "*.xcscheme.xml" -o -name "*.xcworkspacedata.xml" -o -name "*.xcsettings.xml" \) -print | while read f; do
            echo "Renombrando: $f"
            mv "$f" "${f%.xml}"
          done

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.8"
          channel: stable
          cache: true

      - name: Bajar el iOS mínimo a 13.0 (estaba en 17.6)
        run: sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = 17.6;/IPHONEOS_DEPLOYMENT_TARGET = 13.0;/g' "$PROJECT_DIR/ios/Runner.xcodeproj/project.pbxproj"

      - name: Dependencias
        run: cd "$PROJECT_DIR" && flutter pub get

      - name: Compilar iOS sin firmar
        run: cd "$PROJECT_DIR" && flutter build ios --release --no-codesign

      - name: Armar el IPA
        run: |
          cd "$PROJECT_DIR/build/ios/iphoneos"
          mkdir Payload
          cp -R Runner.app Payload/
          zip -qr JUANSE.ipa Payload

      - name: Subir IPA
        uses: actions/upload-artifact@v4
        with:
          name: JUANSE_ipa
          path: ${{ env.PROJECT_DIR }}/build/ios/iphoneos/JUANSE.ipa
