name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

env:
  PROJECT_DIR: Applicacion/APP_JUANSE/app/la_libre_2026_ble

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Limpiar gradle.properties
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: |
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

      - name: Dependencias
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      - name: Compilar APK release
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter build apk --release

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: la_libre_apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
